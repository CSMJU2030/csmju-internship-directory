# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json
# ห้ามใส่บัญชีหรือรหัสผ่านในไฟล์นี้ (ถ้ามี test_accounts conformance จะตก) — บัญชีทดสอบอยู่ในไฟล์นอก repo
# ที่ CONFORMANCE_ACCOUNTS_FILE ชี้ ดู standards/docs/conformance.md ข้อ 2.1
# เวอร์ชัน standards อยู่ใน .standards-version ไฟล์เดียว

name: csmju-internship-directory      # ตรงกับทะเบียนใน Core Hub, SUBSYSTEM_ID และ data.service ของ /api/health
conformance_level: L3                 # ระบบที่มี UI ต้องถึง L3

# frontend (Next.js) เป็นประตูเดียว: ส่ง /api/* และ /auth/login /auth/callback /auth/logout ต่อไปที่ backend
# TODO(พอร์ต): 3240/4240 เป็นค่าชั่วคราว — เปลี่ยนเป็นพอร์ต 32xx/42xx ที่ผู้ดูแล dev server กำหนดให้ทีม
base_url: http://localhost:3240       # พอร์ต frontend · localhost ไม่ใช่ 127.0.0.1
core_hub_url: https://csmju2030.jowave.com       # Core Hub จริง (API อยู่ใต้ /api/v1)
core_hub_web_url: https://csmju2030.jowave.com   # เว็บที่ /auth/login และ /auth/logout ส่งเบราว์เซอร์ไป
callback_path: /auth/callback         # base_url + callback_path = Callback URL ที่ลงทะเบียน

# endpoint ที่เรียกได้โดยไม่มี token (SSO 1.1)
public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

# conformance ตรวจสัญญา API กับสถานที่ฝึกงาน — staff เพิ่มได้ · guest (ระบบนี้แมปเป็น VIEWER) เพิ่มไม่ได้ = 403
probes:
  collection: /api/v1/internship-places
  not_found: /api/v1/internship-places/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/internship-places/not-a-uuid
  create:
    path: /api/v1/internship-places
    allowed_role: staff
    denied_role: guest                # role ที่มีบัญชีรหัสผ่านบน Core Hub จริง — student มีแต่ MJU SSO
    invalid_body:                     # ชื่อว่าง · ไม่มีพิกัด · notes สั้นเกิน → 400 VALIDATION_ERROR
      name: ""
      province: เชียงใหม่
      notes: ""
    valid_body:                       # ผ่าน validation (ใช้กับ denied_role เท่านั้น จึงไม่เกิดรายการจริง)
      name: Conformance probe place
      province: เชียงใหม่
      latitude: 18.8953
      longitude: 99.0132
      notes: Conformance probe - not a real place

owners:
  pl: "@csmju2030/pl-internship-directory"
  aie: "@csmju2030/aie-internship-directory"

display_name: "Internship Directory"
repo: github.com/CSMJU2030/csmju-internship-directory
status: proposed
